name: Publish Flutter SDK

on:
  push:
    tags:
      - "ayni_sdk-v*"

permissions:
  contents: read

jobs:
  verify-package:
    name: Verify package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Verify tag, version, and changelog
        working-directory: packages/sdk_flutter
        run: |
          version="$(sed -n 's/^version: //p' pubspec.yaml | tr -d '\"')"
          awk -v heading="## $version - " '
            /^## / {
              if (found) exit
              if (index($0, heading) == 1) found = 1
              next
            }
            found && $0 !~ /^$/ && $0 !~ /^### / { has_notes = 1 }
            END { exit !(found && has_notes) }
          ' CHANGELOG.md
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            tag_version="${GITHUB_REF_NAME#ayni_sdk-v}"
            test "$version" = "$tag_version"
          fi

      - name: Resolve dependencies
        working-directory: packages/sdk_flutter
        run: dart pub get

      - name: Analyze package
        working-directory: packages/sdk_flutter
        run: dart analyze

      - name: Test package
        working-directory: packages/sdk_flutter
        run: dart test

      - name: Verify publish archive
        working-directory: packages/sdk_flutter
        run: dart pub publish --dry-run

  verify-platforms:
    name: Verify ${{ matrix.platform }} build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Create SDK consumer app
        run: |
          flutter create --platforms=${{ matrix.platform }} \
            --project-name ayni_sdk_release_check \
            release-check-app

      - name: Add SDK from this release commit
        working-directory: release-check-app
        run: |
          flutter pub add "ayni_sdk@{path: $GITHUB_WORKSPACE/packages/sdk_flutter}"

      # tflite_flutter 0.12.x targets Java 11 while Flutter 3.44 targets Kotlin 17.
      - name: Align tflite_flutter Android JVM targets
        if: matrix.platform == 'android'
        run: |
          plugin_gradle="$(find "$HOME/.pub-cache/hosted/pub.dev" -path '*/tflite_flutter-*/android/build.gradle' -print -quit)"
          test -n "$plugin_gradle"
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' "$plugin_gradle"

      - name: Build Android app
        if: matrix.platform == 'android'
        working-directory: release-check-app
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          flutter build apk --debug

      - name: Build iOS app
        if: matrix.platform == 'ios'
        working-directory: release-check-app
        run: |
          sed -i '' "s/# platform :ios, '.*'/platform :ios, '11.0'/" ios/Podfile
          flutter build ios --no-codesign --debug

  publish:
    name: Publish verified version
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/ayni_sdk-v')
    needs: [verify-package, verify-platforms]
    permissions:
      contents: read
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/sdk_flutter
