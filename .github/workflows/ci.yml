name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx @biomejs/biome check .

      - name: Type check
        run: bun run check-types

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  sdk:
    name: Flutter SDK (Android scope)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve SDK dependencies
        working-directory: packages/sdk_flutter
        run: dart pub get

      - name: Analyze SDK package
        working-directory: packages/sdk_flutter
        run: dart analyze

      - name: Test SDK package
        working-directory: packages/sdk_flutter
        run: dart test

      - name: Resolve demo app dependencies
        working-directory: apps/native
        run: flutter pub get

      - name: Analyze Android demo app
        working-directory: apps/native
        run: flutter analyze

      - name: Test Android demo app
        working-directory: apps/native
        run: flutter test
