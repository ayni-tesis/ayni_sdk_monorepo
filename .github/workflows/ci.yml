name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master", "codex/**"]

jobs:
  ci:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Lint
        run: bunx @biomejs/biome check .

      - name: Type check
        run: bun run check-types

      # Fails when openapi.json is stale or a /sdk/* server route is missing from it (US-144).
      - name: Verify OpenAPI document
        run: bun run --filter @ayni/api openapi:verify

      - name: Build
        run: bun run build

      - name: Test
        run: bun run test

  docs:
    name: Documentación
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The same Flutter as the `sdk` job, which the Dart reference pins.
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      # Dart examples (`dart analyze`), the workflow JSON example, the contracts
      # the pages quote, `openapi:verify`, the build with its internal links
      # and anchors, and a non-blocking check of external links (US-150).
      - name: Verificar documentación
        working-directory: apps/docs
        run: bun run verify

  sdk:
    name: Flutter SDK (Android scope)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Pinned: the committed Dart API reference is `dart doc` output, which
      # changes with the SDK's dartdoc (US-143, ADR 0002).
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Resolve SDK dependencies
        working-directory: packages/sdk_flutter
        run: dart pub get

      - name: Resolve SDK example app dependencies
        working-directory: packages/sdk_flutter/example/app
        run: flutter pub get

      - name: Analyze SDK package
        working-directory: packages/sdk_flutter
        run: dart analyze

      - name: Test SDK package
        working-directory: packages/sdk_flutter
        run: dart test

      - name: Verify SDK publish archive
        working-directory: packages/sdk_flutter
        run: dart pub publish --dry-run

      - name: Analyze SDK example app
        working-directory: packages/sdk_flutter/example/app
        run: flutter analyze

      - name: Test SDK example app
        working-directory: packages/sdk_flutter/example/app
        run: flutter test

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Check Dart API reference is up to date
        working-directory: apps/docs
        run: |
          bun src/reference/generate.ts
          if [ -n "$(git status --porcelain -- public/referencia/api-dart)" ]; then
            git status --porcelain -- public/referencia/api-dart
            echo "::error::The Dart API reference is out of date. With Flutter 3.44.8, run 'dart pub get' in packages/sdk_flutter and 'bun run reference:dart' in apps/docs, then commit public/referencia/api-dart."
            exit 1
          fi

      - name: Resolve demo app dependencies
        working-directory: apps/native
        run: flutter pub get

      - name: Analyze Android demo app
        working-directory: apps/native
        run: flutter analyze

      - name: Test Android demo app
        working-directory: apps/native
        run: flutter test

  sdk-release-platforms:
    name: SDK release build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: android
            os: ubuntu-latest
          - platform: ios
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.8
          cache: true

      - name: Create SDK consumer app
        run: |
          flutter create --platforms=${{ matrix.platform }} \
            --project-name ayni_sdk_release_check \
            release-check-app

      - name: Add SDK from this release commit
        working-directory: release-check-app
        run: |
          flutter pub add "ayni_sdk@{path: $GITHUB_WORKSPACE/packages/sdk_flutter}"

      - name: Build Android app
        if: matrix.platform == 'android'
        working-directory: release-check-app
        run: |
          sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/' android/app/build.gradle.kts
          flutter build apk --debug

      - name: Build iOS app
        if: matrix.platform == 'ios'
        working-directory: release-check-app
        run: |
          sed -i '' "s/# platform :ios, '.*'/platform :ios, '11.0'/" ios/Podfile
          flutter build ios --no-codesign --debug
