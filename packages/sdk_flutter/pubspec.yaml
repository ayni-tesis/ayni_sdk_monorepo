name: ayni_sdk
description: "Offline-first SDK primitives for Ayni Flutter integrations on Android and iOS. Minimums: Android API 26+, iOS 11+."
version: 0.2.0
repository: https://github.com/ayni-tesis/ayni_sdk_monorepo/tree/main/packages/sdk_flutter

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  crypto: ^3.0.6
  ffi: ^2.1.3
  flutter:
    sdk: flutter
  image: ^4.10.1
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  test: ^1.25.0

flutter:
  plugin:
    platforms:
      android:
        package: dev.ayni.ayni_sdk
        pluginClass: AyniDeviceProfilePlugin
      ios:
        pluginClass: AyniDeviceProfilePlugin
